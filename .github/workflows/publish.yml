name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Vercel environment to deploy
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'push' && 'production' || inputs.target }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.21.0"
  VERCEL_CLI_VERSION: "59.3.0"

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret ${name}. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          echo "Vercel credentials are present."

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: deploy
    needs:
      - preflight
      - quality
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ (github.event_name == 'push' || inputs.target == 'production') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      archive: ${{ steps.release.outputs.archive }}
      target: ${{ steps.release.outputs.target }}
      url: ${{ steps.deploy.outputs.url }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Vercel CLI
        run: |
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" --version

      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            target="production"
          else
            target="$REQUESTED_TARGET"
          fi

          if [[ "$target" == "production" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployments are only allowed from main."
            exit 1
          fi

          if [[ "$target" == "production" ]]; then
            base_version="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
            if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::package.json must contain a numeric major.minor version."
              exit 1
            fi
            version="v${base_version}.${GITHUB_RUN_NUMBER}"
          else
            version="preview-${GITHUB_RUN_NUMBER}"
          fi

          archive="${version}-vercel-output.tar.gz"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Validate Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Pull Vercel environment
        env:
          TARGET: ${{ steps.release.outputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "preview" ]]; then
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull \
              --yes \
              --environment=preview \
              --git-branch="$GITHUB_REF_NAME" \
              --token="$VERCEL_TOKEN"
          else
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull \
              --yes \
              --environment=production \
              --token="$VERCEL_TOKEN"
          fi

      - name: Validate application environment
        env:
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          set -euo pipefail
          environment_file=".vercel/.env.${TARGET}.local"

          if [[ ! -f "$environment_file" ]]; then
            echo "::error::Vercel did not provide $environment_file."
            exit 1
          fi

          node --env-file="$environment_file" <<'NODE'
          const requiredNames = [
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
          ]
          const missingNames = requiredNames.filter((name) => !process.env[name]?.trim())

          if (missingNames.length > 0) {
            console.error(
              `::error::Missing required Vercel environment variable(s): ${missingNames.join(", ")}`
            )
            process.exit(1)
          }

          try {
            const supabaseUrl = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL)
            if (supabaseUrl.protocol !== "https:") {
              throw new Error("the URL must use HTTPS")
            }
          } catch {
            console.error("::error::NEXT_PUBLIC_SUPABASE_URL must be a valid HTTPS URL.")
            process.exit(1)
          }

          if (
            process.env.NEXT_PUBLIC_SUPABASE_URL.includes("your-project") ||
            process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY === "your-publishable-key"
          ) {
            console.error("::error::Replace placeholder Supabase environment variable values.")
            process.exit(1)
          }
          NODE

      - name: Build Vercel output
        env:
          TARGET: ${{ steps.release.outputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "production" ]]; then
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          else
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --token="$VERCEL_TOKEN"
          fi

      - name: Package Vercel output
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: tar -czf "$ARCHIVE" .vercel/output

      - name: Upload versioned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.version }}-vercel-output-attempt-${{ github.run_attempt }}
          path: ${{ steps.release.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Deploy prebuilt output
        id: deploy
        env:
          TARGET: ${{ steps.release.outputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          git_metadata=(
            --meta "githubDeployment=1"
            --meta "githubCommitOrg=${GITHUB_REPOSITORY%%/*}"
            --meta "githubCommitRef=$GITHUB_REF_NAME"
            --meta "githubCommitRepo=${GITHUB_REPOSITORY#*/}"
            --meta "githubCommitSha=$GITHUB_SHA"
          )

          if [[ "$TARGET" == "production" ]]; then
            deployment_url="$(
              pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy \
                --prebuilt \
                --prod \
                --skip-domain \
                "${git_metadata[@]}" \
                --token="$VERCEL_TOKEN"
            )"
          else
            deployment_url="$(
              pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy \
                --prebuilt \
                "${git_metadata[@]}" \
                --token="$VERCEL_TOKEN"
            )"
          fi

          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Vercel did not return a valid deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Promote production deployment
        if: steps.release.outputs.target == 'production'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" promote \
            "$DEPLOYMENT_URL" \
            --yes \
            --timeout=5m \
            --token="$VERCEL_TOKEN"

      - name: Write deployment summary
        env:
          TARGET: ${{ steps.release.outputs.target }}
          VERSION: ${{ steps.release.outputs.version }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Vercel deployment"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`$TARGET\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| URL | $DEPLOYMENT_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release
    if: needs.deploy.outputs.target == 'production'
    needs:
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download versioned build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.deploy.outputs.version }}-vercel-output-attempt-${{ github.run_attempt }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.deploy.outputs.version }}
          ARCHIVE: ${{ needs.deploy.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ARCHIVE" --clobber
          else
            gh release create "$VERSION" "$ARCHIVE#Vercel Build Output" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes
          fi
