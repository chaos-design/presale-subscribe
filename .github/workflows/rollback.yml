name: Rollback

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Previous production deployment URL or deployment ID
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-production
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "11.21.0"
  VERCEL_CLI_VERSION: "59.3.0"

jobs:
  rollback:
    name: rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate rollback request
        id: request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          ROLLBACK_TARGET: ${{ inputs.deployment }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production rollbacks must be requested from main."
            exit 1
          fi

          if [[ "$CONFIRMATION" != "ROLLBACK" ]]; then
            echo "::error::Confirmation must exactly match ROLLBACK."
            exit 1
          fi

          rollback_target="${ROLLBACK_TARGET%/}"
          if [[ ! "$rollback_target" =~ ^dpl_[A-Za-z0-9]+$ ]] &&
             [[ ! "$rollback_target" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*\.vercel\.app$ ]]; then
            echo "::error::Use a Vercel deployment ID or generated vercel.app deployment URL."
            exit 1
          fi

          echo "target=$rollback_target" >> "$GITHUB_OUTPUT"

      - name: Validate Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Roll back production
        env:
          ROLLBACK_TARGET: ${{ steps.request.outputs.target }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" rollback \
            "$ROLLBACK_TARGET" \
            --yes \
            --timeout=5m \
            --token="$VERCEL_TOKEN"

      - name: Write rollback summary
        env:
          ROLLBACK_TARGET: ${{ steps.request.outputs.target }}
        run: |
          {
            echo "## Vercel production rollback"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Target | \`$ROLLBACK_TARGET\` |"
            echo "| Requested by | \`$GITHUB_ACTOR\` |"
            echo "| Workflow commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
